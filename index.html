<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Expense Tracker | Dark Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #3b82f6;
            --accent: #10b981;
            --bg-dark: #0f172a;
            --glass: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.8)), 
                        url('https://images.unsplash.com/photo-1554224155-6726b3ff858f?auto=format&fit=crop&q=80&w=2000');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            color: var(--text);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Glassmorphism Cards */
        .card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        h2 { font-size: 1.2rem; color: var(--primary); margin-top: 0; display: flex; align-items: center; gap: 10px; }

        /* Responsive Grid */
        .grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .grid { grid-template-columns: 1fr; }
            .input-group { grid-template-columns: 1fr !important; }
        }

        /* Inputs & Buttons */
        input, select, button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            margin-bottom: 10px;
            width: 100%;
        }

        input:focus { outline: 2px solid var(--primary); background: rgba(255, 255, 255, 0.1); }

        .btn-main { background: var(--primary); border: none; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-main:hover { background: #2563eb; transform: translateY(-2px); }

        .btn-del { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
        .btn-del:hover { background: rgba(239, 68, 68, 0.4); }

        /* Table Styling */
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; padding: 12px; color: #94a3b8; font-size: 0.8rem; text-transform: uppercase; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        td { padding: 14px 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }

        .total-display {
            font-size: 2.5rem;
            font-weight: 800;
            text-align: center;
            background: linear-gradient(to right, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 10px 0;
        }

        canvas { max-height: 300px !important; margin: 0 auto; }
    </style>
</head>
<body>

<div class="container">
    <div class="card" style="text-align: center;">
        <span style="color: #94a3b8; text-transform: uppercase; letter-spacing: 1px;">Total Monthly Spend</span>
        <div id="m-total" class="total-display">$0.00</div>
    </div>

    <div class="grid">
        <div class="sidebar">
            <div class="card">
                <h2>Category Management</h2>
                <input type="text" id="new-category" placeholder="New Head (e.g., Rent)">
                <button class="btn-main" id="add-cat-btn" style="background: var(--accent);">Add Head</button>
                <div id="category-list" style="margin-top: 15px;"></div>
            </div>

            <div class="card">
                <h2>Monthly Pie Chart</h2>
                <canvas id="monthlyChart"></canvas>
            </div>
        </div>

        <div class="main">
            <div class="card">
                <h2>Log New Expense</h2>
                <div class="input-group" style="display: grid; grid-template-columns: 1.5fr 1.5fr 1fr auto; gap: 10px;">
                    <input type="date" id="exp-date">
                    <select id="exp-category"><option value="">Select Head...</option></select>
                    <input type="number" id="exp-amount" placeholder="Amount">
                    <button class="btn-main" id="save-entry-btn">Save</button>
                </div>
            </div>

            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h2>History</h2>
                    <input type="text" id="search-input" placeholder="Search items..." onkeyup="filterTable()" style="width: 200px; margin-bottom: 0;">
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr><th>Date</th><th>Head</th><th>Amount</th><th>Action</th></tr>
                        </thead>
                        <tbody id="log-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAIATSlAXKTIqJPZqwkkZeX3AJjfR2irfs",
        authDomain: "expensetracker-fbc8c.firebaseapp.com",
        projectId: "expensetracker-fbc8c",
        storageBucket: "expensetracker-fbc8c.firebasestorage.app",
        messagingSenderId: "17366275779",
        appId: "1:17366275779:web:f0a98234a1a87a074db476"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let myChart;

    // --- Chart Logic ---
    function updateChart(labels, values) {
        const ctx = document.getElementById('monthlyChart').getContext('2d');
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels,
                datasets: [{
                    data: values,
                    backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899'],
                    borderWidth: 0
                }]
            },
            options: { plugins: { legend: { labels: { color: 'white' } } } }
        });
    }

    // --- Realtime Categories ---
    onSnapshot(collection(db, "categories"), (snap) => {
        const list = document.getElementById('category-list');
        const select = document.getElementById('exp-category');
        list.innerHTML = ''; select.innerHTML = '<option value="">Select Head...</option>';
        snap.forEach(d => {
            const name = d.data().name;
            list.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:8px; background:rgba(255,255,255,0.05); padding:8px; border-radius:6px;">
                ${name} <button class="btn-del" style="padding:2px 8px" onclick="deleteData('categories','${d.id}')">×</button>
            </div>`;
            select.innerHTML += `<option value="${name}">${name}</option>`;
        });
    });

    document.getElementById('add-cat-btn').onclick = () => {
        const name = document.getElementById('new-category').value;
        if(name) addDoc(collection(db, "categories"), { name });
        document.getElementById('new-category').value = '';
    };

    // --- Realtime Expenses ---
    const q = query(collection(db, "expenses"), orderBy("date", "desc"));
    onSnapshot(q, (snap) => {
        const logBody = document.getElementById('log-body');
        logBody.innerHTML = '';
        let total = 0; let headTotals = {};

        snap.forEach(d => {
            const data = d.data();
            total += data.amt;
            headTotals[data.cat] = (headTotals[data.cat] || 0) + data.amt;
            logBody.innerHTML += `<tr>
                <td>${data.date}</td>
                <td><span style="color:var(--primary)">${data.cat}</span></td>
                <td>$${data.amt.toLocaleString()}</td>
                <td><button class="btn-del" onclick="deleteData('expenses','${d.id}')">Delete</button></td>
            </tr>`;
        });

        document.getElementById('m-total').innerText = `$${total.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
        updateChart(Object.keys(headTotals), Object.values(headTotals));
    });

    document.getElementById('save-entry-btn').onclick = () => {
        const date = document.getElementById('exp-date').value;
        const cat = document.getElementById('exp-category').value;
        const amt = parseFloat(document.getElementById('exp-amount').value);
        if(date && cat && amt) addDoc(collection(db, "expenses"), { date, cat, amt });
    };

    window.deleteData = async (coll, id) => { if(confirm("Delete item?")) await deleteDoc(doc(db, coll, id)); };

    window.filterTable = () => {
        const val = document.getElementById('search-input').value.toUpperCase();
        const rows = document.getElementById('log-body').getElementsByTagName('tr');
        for (let row of rows) {
            row.style.display = row.innerText.toUpperCase().includes(val) ? "" : "none";
        }
    };
</script>
</body>
</html>
