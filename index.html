<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Expense Tracker</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{
--primary:#3b82f6;
--accent:#10b981;
--bg:#0f172a;
--glass:rgba(30,41,59,.7);
--text:#f8fafc;
}

body{
font-family:Arial;
background:#0f172a;
color:white;
margin:0;
}

nav{
display:flex;
gap:20px;
padding:15px;
background:#020617;
}

nav div{
cursor:pointer;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.card{
background:rgba(30,41,59,.7);
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

input,select,button{
padding:10px;
border-radius:6px;
border:none;
margin-bottom:10px;
}

button{
background:#3b82f6;
color:white;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
}

td,th{
padding:10px;
border-bottom:1px solid #334155;
}

.grid{
display:grid;
grid-template-columns:1fr 2fr;
gap:20px;
}

.hidden{
display:none;
}

</style>
</head>

<body>

<nav>

<div onclick="switchTab('dashboard')">Dashboard</div>
<div onclick="switchTab('analytics')">Analytics</div>

</nav>


<div id="dashboard-tab" class="container">

<div class="card" style="display:flex;justify-content:space-between">

<div>

<span>Monthly Spend</span>

<h1 id="m-total">₹0</h1>

</div>

<div>

<label>Select Month</label><br>

<input type="month" id="month-filter">

</div>

</div>


<div class="card">

<h3>Monthly Category Summary</h3>

<div id="monthly-summary"></div>

</div>


<div class="grid">

<div>

<div class="card">

<h3>Add Category</h3>

<input id="new-cat" placeholder="Category">

<button onclick="addCat()">Add</button>

<div id="cat-list"></div>

</div>

</div>


<div>

<div class="card">

<h3>Add Expense</h3>

<input type="date" id="exp-date">

<select id="exp-cat"></select>

<input type="number" id="exp-amt" placeholder="Amount">

<button onclick="saveEntry()">Save</button>

</div>


<div class="card">

<h3>Expense History</h3>

<table>

<thead>

<tr>

<th>Date</th>
<th>Category</th>
<th>Amount</th>
<th></th>

</tr>

</thead>

<tbody id="hist-body"></tbody>

</table>

</div>


<div class="card hidden" id="category-detail">

<h3 id="cat-title"></h3>

<table>

<thead>

<tr>

<th>Date</th>
<th>Amount</th>

</tr>

</thead>

<tbody id="cat-body"></tbody>

</table>

</div>

</div>

</div>

</div>


<div id="analytics-tab" class="container hidden">

<div class="card">

<h2>Expense Distribution</h2>

<canvas id="monthlyChart"></canvas>

</div>

</div>



<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth,onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore,collection,addDoc,onSnapshot,query,where,deleteDoc,doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


const firebaseConfig = {

apiKey:"AIzaSyAIATSlAXKTIqJPZqwkkZeX3AJjfR2irfs",
authDomain:"expensetracker-fbc8c.firebaseapp.com",
projectId:"expensetracker-fbc8c",
storageBucket:"expensetracker-fbc8c.firebasestorage.app",
messagingSenderId:"17366275779",
appId:"1:17366275779:web:f0a98234a1a87a074db476"

};


const app=initializeApp(firebaseConfig);

const db=getFirestore(app);

const auth=getAuth(app);

let chart;
let entries=[];



window.switchTab=function(tab){

document.getElementById("dashboard-tab").classList.add("hidden");
document.getElementById("analytics-tab").classList.add("hidden");

document.getElementById(tab+"-tab").classList.remove("hidden");

}



window.addCat=function(){

const name=document.getElementById("new-cat").value;

if(!name)return;

addDoc(collection(db,"categories"),{

name:name,
uid:auth.currentUser.uid

});

document.getElementById("new-cat").value="";

}



window.saveEntry=function(){

const d=document.getElementById("exp-date").value;

const c=document.getElementById("exp-cat").value;

const a=parseFloat(document.getElementById("exp-amt").value);

if(!d||!c||!a)return;

addDoc(collection(db,"expenses"),{

date:d,
cat:c,
amt:a,
uid:auth.currentUser.uid

});

}



window.delDoc=function(id){

deleteDoc(doc(db,"expenses",id));

}



onAuthStateChanged(auth,user=>{

if(!user)return;

loadData(user.uid);

});



function loadData(uid){

onSnapshot(query(collection(db,"categories"),where("uid","==",uid)),snap=>{

const list=document.getElementById("cat-list");

const select=document.getElementById("exp-cat");

list.innerHTML="";

select.innerHTML="";

snap.forEach(d=>{

list.innerHTML+=`<div>${d.data().name}</div>`;

select.innerHTML+=`<option>${d.data().name}</option>`;

});

});



onSnapshot(query(collection(db,"expenses"),where("uid","==",uid)),snap=>{

const body=document.getElementById("hist-body");

body.innerHTML="";

entries=[];

let month=document.getElementById("month-filter").value;

let total=0;

let catTotals={};

snap.forEach(d=>{

const item=d.data();

if(month && !item.date.startsWith(month))return;

entries.push(item);

total+=item.amt;

if(!catTotals[item.cat])catTotals[item.cat]=0;

catTotals[item.cat]+=item.amt;

body.innerHTML+=`

<tr>

<td>${item.date}</td>

<td>${item.cat}</td>

<td>₹${item.amt}</td>

<td><button onclick="delDoc('${d.id}')">X</button></td>

</tr>

`;

});

document.getElementById("m-total").innerText="₹"+total;



buildSummary(catTotals,total);

updateChart(catTotals);

});

}



function buildSummary(catTotals,total){

const div=document.getElementById("monthly-summary");

div.innerHTML="";

Object.keys(catTotals).forEach(cat=>{

let val=catTotals[cat];

let pct=((val/total)*100).toFixed(1);

div.innerHTML+=`

<div style="display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #334155;cursor:pointer"

onclick="showCategory('${cat}')">

<span>${cat}</span>

<span>₹${val} (${pct}%)</span>

</div>

`;

});

}



window.showCategory=function(cat){

const body=document.getElementById("cat-body");

body.innerHTML="";

entries.filter(e=>e.cat==cat)

.sort((a,b)=>new Date(a.date)-new Date(b.date))

.forEach(e=>{

body.innerHTML+=`

<tr>

<td>${e.date}</td>

<td>₹${e.amt}</td>

</tr>

`;

});

document.getElementById("cat-title").innerText=cat+" Expenses";

document.getElementById("category-detail").classList.remove("hidden");

}



function updateChart(catTotals){

const ctx=document.getElementById("monthlyChart");

if(chart)chart.destroy();

chart=new Chart(ctx,{

type:"pie",

data:{

labels:Object.keys(catTotals),

datasets:[{

data:Object.values(catTotals),

backgroundColor:["#3b82f6","#10b981","#f59e0b","#ef4444","#8b5cf6"]

}]

}

});

}



document.getElementById("month-filter").onchange=()=>location.reload();

</script>

</body>
</html>
